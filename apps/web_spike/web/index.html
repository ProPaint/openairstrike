<!doctype html>
<!-- Web spike page (docs/web-spike.md). Query string:
       app=game (default) or app=level (Stage A: level 1 at scroll 500, scrolling)
       game: level=N (default 1), bot=1, touch=1, noaudio=1, frames=N, god=1
       level: scroll=Y, hold=1
     The game data (game_data.data / game_data.js) is made by tools/web_build.sh from the
     owner's own paks and is never published. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirStrike 3D web spike</title>
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 14px sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  canvas { display: block; background: #000; outline: none; max-width: 100vw; touch-action: none; }
  #status { min-height: 1.2em; }
  a { color: #8cf; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="800" height="600" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading...</div>
  <div>
    <a href="?app=game&level=1">play mission 1</a> ·
    <a href="?app=game&level=1&bot=1">bot plays mission 1</a> ·
    <a href="?app=game&level=1&touch=1">touch controls</a> ·
    <a href="?app=level">level 1 viewer</a>
    <br>Keys: arrows move, Ctrl fire, Shift missile, Space power-up, 1/2/3 cycle, P pause, Return confirms a hint.
    Sound starts after the first key press or click.
  </div>
</div>
<script>
  // Everything the engine logs, with page timestamps, for tools and for the console.
  window.as3dLog = [];
  const t0 = performance.now();
  function logLine(text) {
    window.as3dLog.push({ t: performance.now(), text });
    console.log(text);
  }
  const q = new URLSearchParams(location.search);
  const app = q.get('app') === 'level' ? 'level' : 'game';
  const args = [];
  if (app === 'game') {
    args.push('--level', q.get('level') || '1');
    if (q.get('bot') === '1') args.push('--bot');
    if (q.get('touch') === '1') args.push('--touch');
    if (q.get('noaudio') === '1') args.push('--no-audio');
    if (q.get('god') === '1') args.push('--god');
    if (q.get('frames')) args.push('--frames', q.get('frames'));
    if (q.get('difficulty')) args.push('--difficulty', q.get('difficulty'));
  } else {
    if (q.get('scroll')) args.push('--scroll', q.get('scroll'));
    if (q.get('hold') === '1') args.push('--hold');
  }
  const status = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: args,
    print: logLine,
    printErr: logLine,
    setStatus: (s) => { status.textContent = s || (app === 'game' ? 'Running. Click the game to give it the keyboard.' : 'Running.'); },
    monitorRunDependencies: () => {},
    onRuntimeInitialized: () => { window.as3dRuntimeMs = performance.now() - t0; },
    onAbort: (what) => { logLine('ABORT: ' + what); status.textContent = 'Aborted: ' + what; },
  };
  window.addEventListener('error', (e) => logLine('PAGE_ERROR: ' + e.message));
  Module.canvas.addEventListener('webglcontextlost', (e) => { logLine('WEBGL_CONTEXT_LOST'); e.preventDefault(); });
  Module.canvas.addEventListener('mousedown', () => Module.canvas.focus());
  function load(src) {
    return new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = () => fail(new Error('cannot load ' + src));
      document.body.appendChild(s);
    });
  }
  load('game_data.js').then(() => load('as3d_web_' + app + '.js')).catch((e) => {
    status.textContent = e.message;
    logLine('PAGE_ERROR: ' + e.message);
  });
</script>
</body>
</html>
