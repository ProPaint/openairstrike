// The AirStrike games for Android: the game (apps/game) with touch controls. See docs/android.md.
// A personal build may bundle the original game data (copyrighted); the release build
// (AS3D_ANDROID_GAMES=none, AS3D_ANDROID_RELEASE=1) holds none and imports the player's own.
plugins {
    id "com.android.application"
}

// Repository root (the worktree/checkout that contains engine/, apps/, docs/).
def repoRoot = rootDir.parentFile

// SDL2 sources, fetched by tools/fetch_third_party.sh into third_party_local/
// (gitignored, shared across worktrees via AS3D_DATA_ROOT). Overridable so the
// build scripts can point at a machine-specific location.
def dataRoot = System.getenv("AS3D_DATA_ROOT") ?: repoRoot.absolutePath
def sdl2Dir = System.getenv("AS3D_SDL2_DIR") ?: "${dataRoot}/third_party_local/SDL2-2.30.12"
// ABIs to build: arm64-v8a for phones, x86_64 for the emulator. AS3D_ANDROID_ABIS narrows it
// (comma-separated) to save build time.
def abiList = (System.getenv("AS3D_ANDROID_ABIS") ?: "arm64-v8a,x86_64").split(",").collect { it.trim() }
// Parallel native compile jobs (the build machine is shared).
def nativeJobs = System.getenv("AS3D_NATIVE_JOBS") ?: "4"
// Version: AS3D_VERSION (the release tag without its "v") and AS3D_VERSION_CODE (a growing
// integer; the release workflow derives it from the tag). Defaults mark a development build.
def versionNameEnv = System.getenv("AS3D_VERSION") ?: "0.3.0-dev"
def versionCodeEnv = (System.getenv("AS3D_VERSION_CODE") ?: "1").toInteger()
// Release signing from the environment (the release workflow decodes the keystore secret into
// a temporary file; nothing is ever committed). Without a keystore the release build is
// unsigned, which Gradle reports as an unsigned APK.
def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def hasReleaseKey = keystoreFile != null && new File(keystoreFile).exists()

if (!new File(sdl2Dir, "include/SDL.h").exists()) {
    // Not fatal here: Gradle configures every included project (this one)
    // even for tasks that don't need native code (e.g. "gradlew wrapper" or
    // "gradlew tasks"). tools/android_build.sh always runs
    // tools/fetch_third_party.sh first, so by the time externalNativeBuild
    // actually runs this will be present; if it isn't, CMake configuration
    // fails below with a clear message instead.
    logger.warn(
        "SDL2 sources not found at ${sdl2Dir}. Run tools/fetch_third_party.sh " +
        "before building native code (or set AS3D_SDL2_DIR)."
    )
}

android {
    namespace "org.as3dport.game"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.as3dport.game"
        minSdk 26
        targetSdk 36
        versionCode versionCodeEnv
        versionName versionNameEnv

        ndk {
            abiFilters(*abiList)
        }

        externalNativeBuild {
            cmake {
                arguments "-DAS3D_SDL2_SOURCE_DIR=${sdl2Dir}",
                          "-DAS3D_REPO_ROOT=${repoRoot.absolutePath}",
                          "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
                          "-DCMAKE_JOB_POOLS=compile=${nativeJobs};link=1",
                          "-DCMAKE_JOB_POOL_COMPILE=compile",
                          "-DCMAKE_JOB_POOL_LINK=link"
                abiFilters(*abiList)
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    // The three original pak archives are copied into assets/ by
    // tools/android_build.sh (gitignored: android/app/src/main/assets/*.apk).
    // Keep them stored uncompressed so SDL_RWFromFile/AAsset can seek into
    // them cheaply at the byte offsets recorded in the pak file table.
    androidResources {
        noCompress += ["apk"]
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Debug signing (default debug keystore, never committed) is fine: this APK
            // embeds copyrighted game data and is for personal use/testing only. The native
            // code is optimised all the same (RelWithDebInfo above).
            jniDebuggable true
        }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // SDL's Java glue (org.libsdl.app.*) is referenced in place from the
    // unpacked SDL2 sources rather than copied into this repository.
    sourceSets {
        main {
            java.srcDirs += ["${sdl2Dir}/android-project/app/src/main/java"]
        }
        // Optional launcher icon rendered from the owner's game data by
        // tools/android_build.sh (AS3D_ICON_FROM_DATA; gitignored). Build-type resources
        // override main's, so its ic_launcher.xml replaces our own vector icon's.
        def iconFromData = file("src/icon_from_data/res")
        if (iconFromData.exists()) {
            debug.res.srcDirs += [iconFromData]
            release.res.srcDirs += [iconFromData]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
    }
}
